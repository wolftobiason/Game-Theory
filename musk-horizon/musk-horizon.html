<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;overflow:hidden;height:100vh}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
#particles{position:fixed;inset:0;z-index:50;pointer-events:none}
#nav{position:fixed;top:0;left:0;right:0;z-index:200;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:rgba(5,5,5,0.85);border-bottom:1px solid rgba(255,255,255,0.06);height:64px;display:flex;align-items:center;padding:0 20px;gap:12px}

#era-tabs::-webkit-scrollbar{display:none}
.era-tab{padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;color:rgba(255,255,255,0.45);white-space:nowrap;border:1px solid transparent;background:none}
.era-tab:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.06)}
.era-tab.active{color:#fff;background:rgba(227,6,19,0.18);border-color:rgba(227,6,19,0.35)}
#search-input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;padding:6px 12px;font-size:13px;outline:none;width:160px;transition:all .25s;flex-shrink:0}
#search-input:focus{background:rgba(255,255,255,0.1);border-color:rgba(0,200,255,0.4);width:200px}
#search-input::placeholder{color:rgba(255,255,255,0.28)}
#accel-btn{flex-shrink:0;background:rgba(227,6,19,0.14);border:1px solid rgba(227,6,19,0.3);color:#E30613;padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;letter-spacing:.02em}
#accel-btn:hover{background:rgba(227,6,19,0.25)}
#accel-btn.active{background:rgba(227,6,19,0.3);box-shadow:0 0 16px rgba(227,6,19,0.3)}
#tree-wrap{position:fixed;top:64px;bottom:68px;left:0;right:0;overflow:auto;z-index:10}
#tree-wrap::-webkit-scrollbar{height:3px;width:3px}
#tree-wrap::-webkit-scrollbar-track{background:transparent}
#tree-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
#tree-inner{position:relative;width:2820px;height:1060px}
#conn-svg{position:absolute;top:0;left:0;width:2820px;height:1060px;pointer-events:none}
#nodes-layer{position:absolute;top:0;left:0;width:100%;height:100%}
.nc{position:absolute;width:198px;border-radius:15px;padding:15px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.025);backdrop-filter:blur(8px);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,opacity .35s,border-color .3s;user-select:none}
.nc:hover{transform:scale(1.055) translateY(-2px)}
.nc.locked{opacity:.28;cursor:default}
.nc.locked:hover{transform:none}
.nc.unlocked{border-color:rgba(227,6,19,0.28);background:rgba(227,6,19,0.04)}
.nc.researched{box-shadow:0 0 18px rgba(0,200,255,0.12),0 4px 20px rgba(0,0,0,0.5)}
.nc.dimmed{opacity:.15!important}
.nc-icon{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.nc-icon-box{padding:7px;border-radius:9px}
.nc-title{font-weight:700;font-size:12.5px;line-height:1.3;margin-bottom:4px;color:rgba(255,255,255,.92)}
.nc-desc{font-size:10.5px;color:rgba(255,255,255,.38);line-height:1.45;margin-bottom:9px}
.nc-foot{display:flex;align-items:center;justify-content:space-between}
.nc-year{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em}
.pring{transform:rotate(-90deg);overflow:visible}
#prog-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;height:68px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:rgba(5,5,5,0.85);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 24px;gap:16px}
#prog-track{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
#prog-fill{height:100%;background:linear-gradient(90deg,#E30613,#00C8FF);border-radius:2px;width:0%;transition:width .8s cubic-bezier(.32,.72,0,1);box-shadow:0 0 8px rgba(0,200,255,0.5)}
#prog-pct{font-size:19px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:36px;text-align:right}
#sim-year-val{color:rgba(255,255,255,.7);font-weight:700;font-size:14px}
#modal-wrap{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end}
#modal-wrap.open{display:flex}
#modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal-box{position:relative;z-index:1;width:100%;max-width:680px;margin:0 auto;max-height:88vh;overflow-y:auto;background:rgba(8,8,14,0.97);backdrop-filter:blur(40px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,0.09);border-bottom:none;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding:28px 28px 40px}
#modal-wrap.open #modal-box{transform:translateY(0)}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:2000;display:none;background:rgba(8,8,14,0.96);border:1px solid rgba(255,215,0,0.4);border-radius:14px;padding:14px 22px;text-align:center;min-width:260px;pointer-events:none}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) scale(.88) translateY(-8px)}15%{opacity:1;transform:translateX(-50%) scale(1.04) translateY(0)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.96) translateY(-4px)}}
.toast-anim{animation:toastIn 3.2s ease-out forwards}
@keyframes resGlow{0%,100%{box-shadow:0 0 12px rgba(0,200,255,.25)}50%{box-shadow:0 0 28px rgba(0,200,255,.55)}}
.researching{animation:resGlow 1.4s ease-in-out infinite}
.logo{display:flex;align-items:center;gap:7px;flex-shrink:0;text-decoration:none}
.logo-text{font-weight:700;font-size:14px;letter-spacing:-.02em;color:#fff}
</style>

<div id="modal-wrap">

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  researched: new Set(),
  researching: null,
  researchProg: 0,
  researchTimer: null,
  simYear: 2025,
  activeEra: 'all',
  query: '',
  hovered: null,
  accelerating: false,
  accelTimer: null,
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function eraColor(era){ return ERAS[era]?.color || '#00C8FF'; }
function nodeState(id){
  if(S.researched.has(id)) return 'researched';
  const n=NODES.find(x=>x.id===id);
  return n.prereqs.every(p=>S.researched.has(p)) ? 'unlocked' : 'locked';
}
function unlocks(id){ return NODES.filter(n=>n.prereqs.includes(id)); }
function icon(name,color,size=26){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[name]||IC.star}</svg>`;
}

// ─── STARFIELD ───────────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('starfield'), cx=cv.getContext('2d');
  let stars=[], shots=[], t=0;
  function resize(){
    cv.width=innerWidth; cv.height=innerHeight; stars=[];
    for(let i=0;i<220;i++) stars.push({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:Math.random()*1.1+.2, o:Math.random()*.55+.15,
      sp:Math.random()*.4+.05, ph:Math.random()*Math.PI*2
    });
  }
  addEventListener('resize',resize); resize();
  function raf(){
    cx.clearRect(0,0,cv.width,cv.height); t+=.008;
    stars.forEach(s=>{
      const tw=s.o*(.55+.45*Math.sin(t*s.sp+s.ph));
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
      cx.fillStyle=`rgba(255,255,255,${tw})`; cx.fill();
    });
    if(Math.random()<.004) shots.push({x:Math.random()*cv.width*.7,y:Math.random()*cv.height*.35,vx:7+Math.random()*5,vy:2+Math.random()*4,life:1});
    shots=shots.filter(s=>{
      s.x+=s.vx; s.y+=s.vy; s.life-=.028;
      if(s.life<=0) return false;
      const g=cx.createLinearGradient(s.x-s.vx*9,s.y-s.vy*9,s.x,s.y);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${s.life*.75})`);
      cx.beginPath(); cx.moveTo(s.x-s.vx*9,s.y-s.vy*9); cx.lineTo(s.x,s.y);
      cx.strokeStyle=g; cx.lineWidth=1.4; cx.stroke(); return true;
    });
    requestAnimationFrame(raf);
  } raf();
})();

// ─── PARTICLES ───────────────────────────────────────────────────────────────
const pCv=document.getElementById('particles'), pCx=pCv.getContext('2d');
let pArr=[];
function resizePc(){ pCv.width=innerWidth; pCv.height=innerHeight; }
addEventListener('resize',resizePc); resizePc();
function burst(x,y,big=false){
  const count=big?60:28;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*(big?6:3.5)+1;
    pArr.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,r:Math.random()*(big?3.5:2.5)+1,
      col:Math.random()>.45?'0,200,255':Math.random()>.5?'255,215,0':'227,6,19'});
  }
}
(function rafP(){
  pCx.clearRect(0,0,pCv.width,pCv.height);
  pArr=pArr.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.life-=.022;
    if(p.life<=0) return false;
    pCx.beginPath(); pCx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    pCx.fillStyle=`rgba(${p.col},${p.life})`; pCx.fill(); return true;
  });
  requestAnimationFrame(rafP);
})();

// ─── RENDER CONNECTIONS ───────────────────────────────────────────────────────
function renderConns(){
  const g=document.getElementById('conn-lines');
  g.innerHTML='';
  NODES.forEach(node=>{
    node.prereqs.forEach(pid=>{
      const pre=NODES.find(n=>n.id===pid); if(!pre) return;
      const fx=pre.x+198, fy=pre.y+75;
      const tx=node.x,    ty=node.y+75;
      const mid=(tx-fx)*.48;
      const d=`M${fx} ${fy} C${fx+mid} ${fy},${tx-mid} ${ty},${tx} ${ty}`;
      const preDone=S.researched.has(pid);
      const nodeDone=S.researched.has(node.id);
      const active=preDone;
      const hov=S.hovered===node.id||S.hovered===pid;
      const isHovConn=hov&&(S.hovered===node.id||S.hovered===pid);

      // Base dim line
      const base=document.createElementNS('http://www.w3.org/2000/svg','path');
      base.setAttribute('d',d); base.setAttribute('fill','none');
      base.setAttribute('stroke','rgba(255,255,255,0.055)');
      base.setAttribute('stroke-width','1.5');
      base.setAttribute('stroke-dasharray','4 5');
      g.appendChild(base);

      if(active){
        const gline=document.createElementNS('http://www.w3.org/2000/svg','path');
        gline.setAttribute('d',d); gline.setAttribute('fill','none');
        const col=nodeDone?'#FFD700':'#00C8FF';
        gline.setAttribute('stroke',isHovConn?'#FFD700':col);
        gline.setAttribute('stroke-width',isHovConn?'2.5':'1.5');
        gline.setAttribute('opacity',isHovConn?'.9':'.38');
        gline.setAttribute('filter','url(#gf)');
        g.appendChild(gline);
      }
    });
  });
}

// ─── RENDER NODES ────────────────────────────────────────────────────────────
function renderNodes(){
  const layer=document.getElementById('nodes-layer');
  // Remove old node cards but not era labels
  layer.querySelectorAll('.nc').forEach(el=>el.remove());

  NODES.forEach(node=>{
    const ns=nodeState(node.id);
    const col=eraColor(node.era);
    const isRes=S.researching===node.id;
    const matchSearch=!S.query||node.name.toLowerCase().includes(S.query)||node.desc.toLowerCase().includes(S.query);
    const matchEra=S.activeEra==='all'||node.era===S.activeEra;
    const dim=!matchSearch||!matchEra;

    const el=document.createElement('div');
    el.className=`nc ${ns}${isRes?' researching':''}${dim?' dimmed':''}`;
    el.id=`nc-${node.id}`;

    // Styles per state
    let borderCol='rgba(255,255,255,0.07)';
    let bgCol='rgba(255,255,255,0.025)';
    let shadow='0 4px 16px rgba(0,0,0,0.4)';
    if(ns==='researched'){ borderCol=col+'44'; bgCol=col+'10'; shadow=`0 0 20px ${col}22,0 4px 20px rgba(0,0,0,0.5)`; }
    else if(ns==='unlocked'){ borderCol=col+'30'; bgCol=col+'07'; }

    el.style.cssText=`left:${node.x}px;top:${node.y}px;border-color:${borderCol};background:${bgCol};box-shadow:${shadow};`;

    // Progress ring
    const R=13, C=2*Math.PI*R;
    const prog=ns==='researched'?1:isRes?S.researchProg:0;
    const dashOff=C*(1-prog);

    el.innerHTML=`
      <div class="nc-icon">
        <div class="nc-icon-box" style="background:${col}18">${icon(node.icon,col)}</div>
        <div style="position:relative;width:30px;height:30px;flex-shrink:0">
          <svg width="30" height="30" class="pring" viewBox="0 0 30 30">
            <circle cx="15" cy="15" r="${R}" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2"/>
            <circle cx="15" cy="15" r="${R}" fill="none" stroke="${col}" stroke-width="2"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${dashOff.toFixed(1)}"
              style="transition:stroke-dashoffset .08s;filter:drop-shadow(0 0 3px ${col})"/>
          </svg>
          ${ns==='researched'?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>`:''}
        </div>
      </div>
      <div class="nc-title" style="color:rgba(255,255,255,${ns==='locked'?.4:.92})">${node.name}</div>
      <div class="nc-desc">${node.desc}</div>
      <div class="nc-foot">
        <span class="nc-year" style="color:${col};background:${col}18">${node.year}</span>
        ${ns==='locked'?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`:''}
        ${node.milestone&&ns==='researched'?`<span style="font-size:9px;color:#FFD700;letter-spacing:.08em">★ MILESTONE</span>`:''}
      </div>`;

    if(ns!=='locked'){
      el.addEventListener('click',()=>clickNode(node.id));
    }
    el.addEventListener('mouseenter',()=>hoverNode(node.id));
    el.addEventListener('mouseleave',()=>hoverNode(null));
    layer.appendChild(el);
  });

  renderConns();
  updateProg();
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function updateProg(){
  const pct=Math.round(S.researched.size/NODES.length*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct;
}

// ─── HOVER ───────────────────────────────────────────────────────────────────
function hoverNode(id){
  S.hovered=id;
  renderConns();
  NODES.forEach(n=>{
    const el=document.getElementById(`nc-${n.id}`); if(!el) return;
    if(!id){ el.style.filter=''; return; }
    const hn=NODES.find(x=>x.id===id);
    const connected=n.id===id||hn?.prereqs.includes(n.id)||n.prereqs.includes(id)||
      unlocks(id).some(u=>u.id===n.id)||NODES.filter(x=>x.prereqs.includes(n.id)).some(x=>x.id===id);
    el.style.filter=connected?'brightness(1.15)':'brightness(0.5)';
  });
}

// ─── CLICK NODE ──────────────────────────────────────────────────────────────
function clickNode(id){
  const ns=nodeState(id);
  if(ns==='locked') return;
  if(ns==='researched'){ openModal(id); return; }
  if(S.researching) return;
  startResearch(id);
}

function startResearch(id){
  S.researching=id; S.researchProg=0;
  renderNodes();
  clearInterval(S.researchTimer);
  S.researchTimer=setInterval(()=>{
    S.researchProg=Math.min(1,S.researchProg+0.038);
    // Update ring only
    const el=document.getElementById(`nc-${id}`);
    if(el){
      const circles=el.querySelectorAll('svg.pring circle');
      if(circles[1]){
        const R=13,C=2*Math.PI*R;
        circles[1].setAttribute('stroke-dashoffset',(C*(1-S.researchProg)).toFixed(1));
      }
    }
    if(S.researchProg>=1){ clearInterval(S.researchTimer); finishResearch(id); }
  },45);
}

function finishResearch(id){
  S.researched.add(id); S.researching=null; S.researchProg=0;
  const el=document.getElementById(`nc-${id}`);
  if(el){ const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); }
  const node=NODES.find(n=>n.id===id);
  if(node?.milestone) showMilestone(node);
  renderNodes();
}

// ─── MILESTONE TOAST ─────────────────────────────────────────────────────────
function showMilestone(node){
  const t=document.getElementById('toast');
  t.innerHTML=`<div style="font-size:22px;margin-bottom:3px">🚀</div><div style="font-weight:700;color:#FFD700;font-size:14px;margin-bottom:3px">Milestone Reached</div><div style="font-size:12px;color:rgba(255,255,255,0.65)">${node.name}</div>`;
  t.style.display='block';
  t.className=''; void t.offsetWidth; t.className='toast-anim';
  setTimeout(()=>{ t.style.display='none'; t.className=''; },3500);
  burst(innerWidth/2, 120, true);
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input',e=>{
  S.query=e.target.value.toLowerCase().trim();
  renderNodes();
});

// ─── ERA TABS ────────────────────────────────────────────────────────────────
document.querySelectorAll('.era-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.era-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    S.activeEra=tab.dataset.era;
    renderNodes();
    if(S.activeEra!=='all'&&ERAS[S.activeEra]){
      document.getElementById('tree-wrap').scrollTo({left:Math.max(0,ERAS[S.activeEra].colX-40),behavior:'smooth'});
    }
  });
});

// ─── ACCELERATE ──────────────────────────────────────────────────────────────
const YEARS=[2025,2026,2027,2028,2029,2030,2031,2032,2033,2034,2035,2036,2037,2038,2039,2040,2041,2042,2043,2044,2045,2046];

function autoResearchUpTo(year){
  let changed=true;
  while(changed){
    changed=false;
    NODES.forEach(n=>{
      if(n.year<=year&&!S.researched.has(n.id)&&n.prereqs.every(p=>S.researched.has(p))){
        S.researched.add(n.id); changed=true;
      }
    });
  }
}

document.getElementById('accel-btn').addEventListener('click',()=>{
  if(S.accelerating){
    S.accelerating=false; clearTimeout(S.accelTimer);
    document.getElementById('accel-btn').classList.remove('active');
    return;
  }
  if(S.researching){ clearInterval(S.researchTimer); S.researching=null; S.researchProg=0; }
  S.accelerating=true;
  document.getElementById('accel-btn').classList.add('active');

  function step(){
    if(!S.accelerating) return;
    const idx=YEARS.indexOf(S.simYear);
    if(idx>=YEARS.length-1){ S.accelerating=false; document.getElementById('accel-btn').classList.remove('active'); return; }
    S.simYear=YEARS[idx+1];
    document.getElementById('sim-year-val').textContent=S.simYear;

    // Find newly researchable nodes this year
    const before=new Set(S.researched);
    autoResearchUpTo(S.simYear);
    const newOnes=[...S.researched].filter(id=>!before.has(id));
    if(newOnes.length>0){
      renderNodes();
      newOnes.forEach((id,i)=>{
        setTimeout(()=>{
          const el=document.getElementById(`nc-${id}`);
          if(el){ const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); }
          const node=NODES.find(n=>n.id===id);
          if(node?.milestone) showMilestone(node);
        },i*180);
      });
    }
    S.accelTimer=setTimeout(step,900);
  }
  step();
});

// ─── INIT ────────────────────────────────────────────────────────────────────
renderEraUI();
renderNodes();
setTimeout(()=>{ document.getElementById('tree-wrap').scrollTop=60; },80);
</script>
</body>
</html>
