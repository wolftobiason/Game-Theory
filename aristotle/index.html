<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aristotle — Find the Mean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0f0b0b;
      --surface:      #161010;
      --card:         #1d1515;
      --card-hover:   #221a1a;
      --border:       #2a2020;
      --accent:       #4e6e44;
      --accent-light: #7a9a6e;
      --gold:         #c8a96e;
      --stone:        #c4b89a;
      --text-primary: #e5ddd0;
      --text-secondary: #8a8278;
      --text-muted:   #52504a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.4rem 3rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(13, 13, 10, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(39,39,32,0.7);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem; font-weight: 400;
      letter-spacing: 0.1em; color: var(--stone);
      text-decoration: none; cursor: pointer;
      user-select: none;
    }

    .nav-links { display: flex; gap: 2.5rem; list-style: none; }

    .nav-links a {
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      cursor: pointer; transition: color 0.25s;
      user-select: none;
    }
    .nav-links a:hover { color: var(--text-secondary); }
    .nav-links a.active { color: var(--stone); }

    /* ─── LAYOUT ──────────────────────────────────── */
    main { padding-top: 72px; }

    .page { display: none; min-height: calc(100vh - 72px); opacity: 0; transition: opacity 0.35s ease; }
    .page.active { display: block; }
    .page.visible { opacity: 1; }

    /* ─── HOME ────────────────────────────────────── */
    .home-hero {
      text-align: center;
      padding: 6rem 2rem 4.5rem;
    }

    .home-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 9vw, 7.5rem);
      font-weight: 300; letter-spacing: 0.1em;
      color: var(--stone); line-height: 1;
      margin-bottom: 0.9rem;
    }

    .home-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.05rem, 2.2vw, 1.45rem);
      font-style: italic; font-weight: 300;
      color: var(--text-muted); letter-spacing: 0.06em;
    }

    .home-rule {
      width: 36px; height: 1px;
      background: var(--border);
      margin: 3rem auto 0;
    }

    /* ─── VIRTUE GRID ─────────────────────────────── */
    .virtue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      max-width: 1180px; margin: 0 auto;
      padding: 0 3rem 6rem;
      background: var(--border);
      border-top: 1px solid var(--border);
    }

    .virtue-card {
      background: var(--bg);
      padding: 2.4rem 2rem 2rem;
      cursor: pointer;
      transition: background 0.25s;
      position: relative; overflow: hidden;
    }

    .virtue-card::after {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom, var(--accent-light), var(--accent));
      transform: scaleY(0); transition: transform 0.3s ease;
      transform-origin: bottom;
    }

    .virtue-card:hover { background: var(--card); }
    .virtue-card:hover::after { transform: scaleY(1); }

    .vc-index {
      font-size: 0.6rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 1.1rem;
    }

    .vc-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 400;
      color: var(--text-primary); margin-bottom: 0.9rem;
      letter-spacing: 0.02em; line-height: 1.15;
    }

    .vc-spectrum {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.67rem; color: var(--text-muted);
      letter-spacing: 0.06em; flex-wrap: wrap;
    }

    .vc-spectrum .mean { color: var(--accent-light); }

    .vc-arrow {
      position: absolute; bottom: 1.8rem; right: 1.8rem;
      color: var(--accent-light); opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .virtue-card:hover .vc-arrow { opacity: 1; transform: translateX(0); }

    /* ─── DETAIL PAGE ─────────────────────────────── */
    .detail-wrap {
      max-width: 880px; margin: 0 auto;
      padding: 4rem 3rem 7rem;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-size: 0.68rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-muted); cursor: pointer;
      transition: color 0.25s; margin-bottom: 3.5rem;
      user-select: none;
    }
    .back-link:hover { color: var(--stone); }

    .detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 6vw, 5.2rem);
      font-weight: 300; color: var(--stone);
      letter-spacing: 0.05em; line-height: 1;
      margin-bottom: 0.4rem;
    }

    .detail-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; color: var(--text-muted); font-size: 1rem;
      margin-bottom: 3.5rem;
    }

    /* spectrum table */
    .spectrum-table {
      width: 100%; border-collapse: collapse; margin-bottom: 1.5rem;
    }

    .spectrum-table th {
      font-size: 0.6rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 1.5rem 0.9rem 0; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .spectrum-table th:last-child { padding-right: 0; }

    .spectrum-table td {
      padding: 1.6rem 1.5rem 1.6rem 0;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .spectrum-table td:last-child { padding-right: 0; }

    .td-deficiency {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem; font-style: italic;
      color: var(--text-secondary); white-space: nowrap;
    }

    .td-mean {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem; font-weight: 500;
      color: var(--accent-light); white-space: nowrap;
    }

    .td-excess {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem; font-style: italic;
      color: var(--text-secondary); white-space: nowrap;
    }

    /* slider cell */
    .td-slider { min-width: 190px; padding-top: 1.6rem; }

    .slider-labels {
      display: flex; justify-content: space-between;
      font-size: 0.58rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 0.55rem;
    }
    .slider-labels .mid { color: var(--accent-light); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 2px;
      background: var(--border);
      outline: none; cursor: pointer;
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--stone); cursor: pointer;
      box-shadow: 0 0 0 3px rgba(196,184,154,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 0 6px rgba(196,184,154,0.16);
    }
    input[type="range"]::-moz-range-thumb {
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--stone); cursor: pointer; border: none;
    }

    .slider-status {
      font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-secondary);
      margin-top: 0.55rem; text-align: center;
      min-height: 1em;
    }

    /* save button */
    .btn-save {
      display: inline-flex; align-items: center; gap: 0.55rem;
      margin-top: 1.8rem;
      padding: 0.75rem 1.8rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; transition: border-color 0.25s, color 0.25s;
    }
    .btn-save:hover { border-color: var(--accent-light); color: var(--stone); }
    .btn-save.saved { border-color: var(--accent); color: var(--accent-light); }

    /* wisdom */
    .wisdom {
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 1px solid var(--border);
    }

    .section-label {
      font-size: 0.6rem; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 1.4rem;
    }

    .wisdom-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem; color: var(--text-primary);
      line-height: 1.85; font-weight: 300;
      margin-bottom: 2.5rem;
    }

    .wisdom-card {
      background: var(--card);
      border-left: 2px solid var(--accent);
      padding: 1.4rem 1.8rem;
      margin-bottom: 1.2rem;
    }

    .wisdom-card-label {
      font-size: 0.58rem; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--accent-light); margin-bottom: 0.7rem;
    }

    .wisdom-card-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-style: italic;
      color: var(--text-primary); line-height: 1.75;
    }

    /* ─── HISTORY PAGE ────────────────────────────── */
    .history-wrap {
      max-width: 780px; margin: 0 auto;
      padding: 4rem 3rem 7rem;
    }

    .history-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 300; color: var(--stone);
      letter-spacing: 0.05em; margin-bottom: 0.4rem;
    }

    .history-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; color: var(--text-muted);
      margin-bottom: 3.5rem;
    }

    .history-empty {
      padding: 5rem 0; text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.1rem;
      color: var(--text-muted);
    }

    .h-entry {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.4rem 0; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: padding-left 0.2s;
    }
    .h-entry:first-of-type { border-top: 1px solid var(--border); }
    .h-entry:hover { padding-left: 0.4rem; }

    .h-entry-left { display: flex; flex-direction: column; gap: 0.25rem; }

    .h-date {
      font-size: 0.62rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-muted);
    }

    .h-virtue {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem; font-weight: 400;
      color: var(--text-primary); transition: color 0.2s;
    }
    .h-entry:hover .h-virtue { color: var(--stone); }

    .h-badge {
      font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.28rem 0.75rem;
    }
    .h-badge.balanced { border-color: var(--accent); color: var(--accent-light); }

    .btn-clear {
      display: inline-flex; align-items: center; gap: 0.45rem;
      margin-top: 2.5rem;
      font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-muted);
      cursor: pointer; background: none; border: none;
      transition: color 0.25s; font-family: 'Inter', sans-serif;
    }
    .btn-clear:hover { color: #a06060; }

    /* ─── TOAST ───────────────────────────────────── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card); border: 1px solid var(--border);
      color: var(--stone);
      font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.7rem 1.4rem;
      transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 200; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 760px) {
      nav { padding: 1.2rem 1.5rem; }
      .virtue-grid { grid-template-columns: 1fr 1fr; padding: 0 0 4rem; }
      .detail-wrap, .history-wrap { padding: 3rem 1.5rem 5rem; }
      .spectrum-table th, .spectrum-table td { padding-right: 0.7rem; }
      .td-deficiency, .td-mean, .td-excess { font-size: 1.05rem; }
    }

    @media (max-width: 480px) {
      .virtue-grid { grid-template-columns: 1fr; }
      .home-hero { padding: 4.5rem 1.5rem 3rem; }
      .spectrum-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-logo" onclick="nav('home')">Aristotle</span>
    <ul class="nav-links">
      <li><a id="nl-home" class="active" onclick="nav('home')">Virtues</a></li>
      <li><a id="nl-history" onclick="nav('history')">History</a></li>
    </ul>
  </nav>

  <main>
    <!-- HOME -->
    <div id="pg-home" class="page">
      <div class="home-hero">
        <h1 class="home-title">Aristotle</h1>
        <p class="home-tagline">Find the Mean.</p>
        <div class="home-rule"></div>
      </div>
      <div class="virtue-grid" id="virtue-grid"></div>
    </div>

    <!-- DETAIL -->
    <div id="pg-detail" class="page">
      <div class="detail-wrap">
        <div class="back-link" onclick="nav('home')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 2.5L4.5 7L9 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          All Virtues
        </div>
        <h1 class="detail-title" id="d-name"></h1>
        <p class="detail-eyebrow">The Aristotelian Spectrum</p>

        <table class="spectrum-table">
          <thead>
            <tr>
              <th>Deficiency</th>
              <th>Golden Mean</th>
              <th>Excess</th>
              <th>Where Are You?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="td-deficiency" id="d-def"></td>
              <td class="td-mean"       id="d-mean"></td>
              <td class="td-excess"     id="d-exc"></td>
              <td class="td-slider">
                <div class="slider-labels">
                  <span>Too Little</span>
                  <span class="mid">Balanced</span>
                  <span>Too Much</span>
                </div>
                <input type="range" id="v-slider" min="0" max="100" value="50">
                <div class="slider-status" id="slider-status">Balanced</div>
              </td>
            </tr>
          </tbody>
        </table>

        <button class="btn-save" id="btn-save" onclick="saveEntry()">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M1.5 6.5L5 10L11.5 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Save Calibration
        </button>

        <div class="wisdom">
          <p class="section-label">On This Virtue</p>
          <p class="wisdom-body" id="d-exp"></p>
          <div class="wisdom-card">
            <p class="wisdom-card-label">Consider</p>
            <p class="wisdom-card-text" id="d-ref"></p>
          </div>
          <div class="wisdom-card">
            <p class="wisdom-card-label">Practice</p>
            <p class="wisdom-card-text" id="d-act"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="pg-history" class="page">
      <div class="history-wrap">
        <h1 class="history-title">Calibrations</h1>
        <p class="history-sub">Your record of reflection</p>
        <div id="history-body"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
/* ─── DATA ──────────────────────────────────────── */
const VIRTUES = [
  {
    id: 'courage',
    name: 'Courage',
    deficiency: 'Cowardice',
    mean: 'Courage',
    excess: 'Recklessness',
    explanation: 'Courage is not the absence of fear, but the reasoned response to genuine danger. The courageous person faces what truly deserves to be feared and acts for noble reasons — neither fleeing from shadows nor charging headlong into needless peril. It is, above all, a virtue of proportion.',
    reflection: 'Where in your life are you holding back out of fear that you know, deep down, is unwarranted?',
    action: 'Identify one thing you have been postponing out of fear. Take one concrete step toward it this week — not to be fearless, but to act rightly despite the fear.'
  },
  {
    id: 'temperance',
    name: 'Temperance',
    deficiency: 'Insensibility',
    mean: 'Temperance',
    excess: 'Self-Indulgence',
    explanation: 'Temperance is the art of enjoying pleasures appropriately — not denying them, but not being enslaved by them either. The temperate person takes pleasure in the right things, to the right degree, at the right time. Both the ascetic and the glutton miss the richness of a well-ordered life.',
    reflection: 'Which pleasures in your life are you pursuing in a way that diminishes rather than enriches you?',
    action: 'Choose one recurring indulgence and observe it mindfully for one week — notice when it serves you and when it quietly controls you.'
  },
  {
    id: 'discipline',
    name: 'Discipline',
    deficiency: 'Sloth',
    mean: 'Discipline',
    excess: 'Rigidity',
    explanation: 'Discipline is the steady commitment to what genuinely matters, without becoming enslaved to routine for its own sake. The disciplined person acts with purposeful consistency, yet remains supple enough to adapt when wisdom demands it. Discipline without judgment becomes its own kind of trap.',
    reflection: 'Are you disciplined toward the things that genuinely matter to you — or merely toward habits that feel safe and require no real courage to maintain?',
    action: 'Audit your daily structure. Identify one meaningful commitment you are avoiding, and one rigid habit that has outlived its purpose.'
  },
  {
    id: 'generosity',
    name: 'Generosity',
    deficiency: 'Miserliness',
    mean: 'Generosity',
    excess: 'Prodigality',
    explanation: 'True generosity gives what is appropriate to the right people at the right time, with warmth and without calculation. The generous person neither hoards what they have nor squanders it without discernment. Giving well requires judgment, not merely abundance or willingness.',
    reflection: 'Do you give freely where it is truly needed, or do you hold back in ways that reflect fear or pride rather than prudence?',
    action: 'Perform one deliberate act of generosity this week — chosen not for recognition, but because it is genuinely the right gift for this person at this moment.'
  },
  {
    id: 'magnanimity',
    name: 'Magnanimity',
    deficiency: 'Pusillanimity',
    mean: 'Magnanimity',
    excess: 'Vanity',
    explanation: 'Magnanimity is the virtue of those who know their worth and claim it rightly — neither underselling themselves through false modesty nor inflating themselves through pride. The magnanimous person accepts honor where it is genuinely due, and is unmoved when it is withheld unjustly.',
    reflection: 'Do you consistently underestimate your own value out of habit, or do you seek recognition that you have not truly earned?',
    action: 'Reflect on one area where you have genuine excellence. Allow yourself to claim it clearly — not boastfully, but without apology.'
  },
  {
    id: 'ambition',
    name: 'Ambition',
    deficiency: 'Apathy',
    mean: 'Right Ambition',
    excess: 'Vainglory',
    explanation: 'Right ambition seeks achievement in proportion to what one actually deserves — aiming neither too low from timidity nor too high from arrogance. The rightly ambitious person is driven by genuine excellence and care for what they do, not by the hollow pursuit of status or others\' approval.',
    reflection: 'Is your ambition directed toward things genuinely worth pursuing, or are you either coasting below your potential or striving for things that will not satisfy?',
    action: 'Write down your three most important goals. Examine whether each is calibrated to your actual values and capacity, not to what others expect or admire.'
  },
  {
    id: 'good-temper',
    name: 'Good Temper',
    deficiency: 'Passivity',
    mean: 'Good Temper',
    excess: 'Irascibility',
    explanation: 'Good temper means being moved to anger at the right things, in the right degree, at the right time, and for the right reasons. The even-tempered person is neither passively indifferent to genuine injustice nor consumed by disproportionate fury at small inconveniences.',
    reflection: 'When you become angry, is it truly directed at what deserves it — or at things that merely inconvenience or embarrass you?',
    action: 'The next time you feel anger rising, pause for ten seconds and ask: is this response proportionate to what is actually happening here?'
  },
  {
    id: 'truthfulness',
    name: 'Truthfulness',
    deficiency: 'Understatement',
    mean: 'Truthfulness',
    excess: 'Boastfulness',
    explanation: 'Truthfulness is the alignment between what one actually is and what one presents to the world. The truthful person neither hides behind false modesty nor projects a self that exceeds reality. They are, simply and quietly, who they are — and this requires a kind of courage all its own.',
    reflection: 'In what areas of your life do you present yourself as more — or less — than you truly are, and why?',
    action: 'In your next important conversation, practice saying one thing that is simply, plainly true about yourself — without embellishment or concealment.'
  },
  {
    id: 'friendliness',
    name: 'Friendliness',
    deficiency: 'Quarrelsomeness',
    mean: 'Friendliness',
    excess: 'Obsequiousness',
    explanation: 'True friendliness is the disposition to be pleasant with others in the right way — neither constantly disagreeable nor excessively eager to please. The friendly person seeks to be agreeable when it costs nothing important, and honest when it does. Neither contrarianism nor flattery is friendship.',
    reflection: 'Do you challenge others too readily out of habit, or do you yield your honest views too easily in order to keep the peace?',
    action: 'In your next social interaction, notice one moment where you can offer genuine warmth without compromising your honesty — and act on it.'
  },
  {
    id: 'modesty',
    name: 'Modesty',
    deficiency: 'Shamelessness',
    mean: 'Modesty',
    excess: 'Bashfulness',
    explanation: 'Modesty is a fitting sense of shame regarding one\'s own behavior — neither brazenly indifferent to how one affects others, nor so consumed by self-consciousness that one cannot act freely. The modest person is appropriately careful, not endlessly self-absorbed.',
    reflection: 'Are you sufficiently aware of how your actions affect those around you, or has self-consciousness become its own obstacle to living well?',
    action: 'Reflect on a recent situation where you may have acted without enough care for others. What would you genuinely do differently — and what would you firmly keep the same?'
  },
  {
    id: 'justice',
    name: 'Justice',
    deficiency: 'Unfairness',
    mean: 'Justice',
    excess: 'Overreach',
    explanation: 'Justice is the virtue of giving each person what they are due — no more, no less. The just person acts fairly in all their dealings, taking neither more than their share nor allowing others to be deprived of what is rightly theirs. It is the one virtue that is always directed outward, toward others.',
    reflection: 'Where in your life do you take more than your share — of credit, resources, attention, or benefit of the doubt — without fully acknowledging it?',
    action: 'Identify one relationship or situation where the balance feels unequal. Take one concrete step this week to move it toward fairness.'
  }
];

/* ─── STATE ─────────────────────────────────────── */
let currentVirtue = null;
let sliderDirty = false;

/* ─── NAV ───────────────────────────────────────── */
function nav(page, virtueId) {
  const pages = { home: 'pg-home', detail: 'pg-detail', history: 'pg-history' };
  const navIds = { home: 'nl-home', history: 'nl-history' };

  Object.values(pages).forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active', 'visible');
  });

  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));

  const target = document.getElementById(pages[page]);
  target.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => target.classList.add('visible')));

  if (page === 'history') {
    document.getElementById('nl-history').classList.add('active');
    renderHistory();
  } else {
    document.getElementById('nl-home').classList.add('active');
  }

  if (page === 'detail' && virtueId) renderDetail(virtueId);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── SLIDER ────────────────────────────────────── */
function sliderLabel(v) {
  if (v < 18)  return 'Far Too Little';
  if (v < 35)  return 'Too Little';
  if (v < 44)  return 'Leaning Deficient';
  if (v <= 56) return 'Balanced';
  if (v < 65)  return 'Leaning Excessive';
  if (v < 82)  return 'Too Much';
  return 'Far Too Much';
}

function updateSlider(v) {
  const val = parseInt(v);
  document.getElementById('slider-status').textContent = sliderLabel(val);
  // gradient: accent green fills from left up to thumb
  const pct = val;
  document.getElementById('v-slider').style.background =
    `linear-gradient(to right, #4e6e44 0%, #4e6e44 ${pct}%, #272720 ${pct}%, #272720 100%)`;
}

document.getElementById('v-slider').addEventListener('input', function () {
  sliderDirty = true;
  updateSlider(this.value);
  const btn = document.getElementById('btn-save');
  btn.classList.remove('saved');
  btn.innerHTML = saveBtnHTML('Save Calibration');
});

/* ─── DETAIL ────────────────────────────────────── */
function renderDetail(id) {
  const v = VIRTUES.find(x => x.id === id);
  if (!v) return;
  currentVirtue = v;
  sliderDirty = false;

  document.getElementById('d-name').textContent = v.name;
  document.getElementById('d-def').textContent  = v.deficiency;
  document.getElementById('d-mean').textContent = v.mean;
  document.getElementById('d-exc').textContent  = v.excess;
  document.getElementById('d-exp').textContent  = v.explanation;
  document.getElementById('d-ref').textContent  = v.reflection;
  document.getElementById('d-act').textContent  = v.action;

  const slider = document.getElementById('v-slider');
  slider.value = 50;
  updateSlider(50);

  const btn = document.getElementById('btn-save');
  btn.classList.remove('saved');
  btn.innerHTML = saveBtnHTML('Save Calibration');
}

function saveBtnHTML(label) {
  return `<svg width="13" height="13" viewBox="0 0 13 13" fill="none">
    <path d="M1.5 6.5L5 10L11.5 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>${label}`;
}

/* ─── SAVE ──────────────────────────────────────── */
function saveEntry() {
  if (!currentVirtue) return;
  const val   = parseInt(document.getElementById('v-slider').value);
  const label = sliderLabel(val);

  const history = loadHistory();
  history.unshift({
    date:      new Date().toISOString(),
    virtueId:  currentVirtue.id,
    virtueName: currentVirtue.name,
    value: val,
    label
  });
  if (history.length > 100) history.length = 100;
  saveHistory(history);

  const btn = document.getElementById('btn-save');
  btn.classList.add('saved');
  btn.innerHTML = saveBtnHTML('Saved');
  toast('Calibration saved');
}

/* ─── HISTORY ───────────────────────────────────── */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('aristotle-history') || '[]'); }
  catch { return []; }
}
function saveHistory(h) { localStorage.setItem('aristotle-history', JSON.stringify(h)); }

function renderHistory() {
  const history = loadHistory();
  const container = document.getElementById('history-body');

  if (!history.length) {
    container.innerHTML = '<p class="history-empty">No calibrations yet.<br>Begin by selecting a virtue.</p>';
    return;
  }

  const isBalanced = v => v >= 35 && v <= 65;
  const fmtDate = iso => new Date(iso).toLocaleDateString('en-US', {
    month: 'long', day: 'numeric', year: 'numeric'
  });

  const rows = history.map(e => `
    <div class="h-entry" onclick="nav('detail','${e.virtueId}')">
      <div class="h-entry-left">
        <span class="h-date">${fmtDate(e.date)}</span>
        <span class="h-virtue">${e.virtueName}</span>
      </div>
      <span class="h-badge${isBalanced(e.value) ? ' balanced' : ''}">${e.label}</span>
    </div>
  `).join('');

  container.innerHTML = rows + `
    <button class="btn-clear" onclick="clearHistory()">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <path d="M1.5 1.5L9.5 9.5M9.5 1.5L1.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Clear History
    </button>`;
}

function clearHistory() {
  if (!confirm('Clear all calibration history?')) return;
  saveHistory([]);
  renderHistory();
  toast('History cleared');
}

/* ─── TOAST ─────────────────────────────────────── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

/* ─── INIT ───────────────────────────────────────── */
function buildGrid() {
  const grid = document.getElementById('virtue-grid');
  grid.innerHTML = VIRTUES.map((v, i) => `
    <div class="virtue-card" onclick="nav('detail','${v.id}')">
      <div class="vc-index">${String(i + 1).padStart(2, '0')}</div>
      <h2 class="vc-name">${v.name}</h2>
      <div class="vc-spectrum">
        <span>${v.deficiency}</span>
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none" style="flex-shrink:0">
          <path d="M0 5H15M11 1.5L15 5L11 8.5" stroke="#52504a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="mean">${v.mean}</span>
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none" style="flex-shrink:0">
          <path d="M0 5H15M11 1.5L15 5L11 8.5" stroke="#52504a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>${v.excess}</span>
      </div>
      <svg class="vc-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M4 10H16M11 5L16 10L11 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  `).join('');
}

buildGrid();

// activate home page with fade-in
const _home = document.getElementById('pg-home');
_home.classList.add('active');
requestAnimationFrame(() =>
  requestAnimationFrame(() => _home.classList.add('visible'))
);
</script>
</body>
</html>
